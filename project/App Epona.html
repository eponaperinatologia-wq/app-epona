<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>App Epona · Haras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f1ea;
    --soft: #ebe5da;
    --card: #fffbf3;
    --line: #e3dccd;
    --line-2: #c9bfaa;
    --ink: #2a2820;
    --ink-2: #5a554a;
    --ink-3: #8d8675;
    --accent: #3d6043;
    --accent-soft: #d8e0d2;
    --accent-ink: #fff;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'Inter', -apple-system, system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #2b2722;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body { display: grid; place-items: center; min-height: 100vh; }
  button { font-family: var(--sans); cursor: pointer; }
  button:active { transform: scale(0.98); }
  input::placeholder { color: var(--ink-3); }
  ::-webkit-scrollbar { display: none; }
  @keyframes toastIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="extra-screens.jsx"></script>
  <script type="text/babel" src="register.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
