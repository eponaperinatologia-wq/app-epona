# Supabase local config — controla behavior das Edge Functions e CLI.
# Só documentamos o que difere do padrão.
project_id = "edqfyzlryfrgojezpwyr"

# Webhook do Assinafy é chamado por servidor externo sem JWT — desativa a
# validação padrão. A segurança fica no HMAC do body (ASSINAFY_WEBHOOK_SECRET).
[functions.assinafy-webhook]
verify_jwt = false

# assinafy-criar-assinatura, assinafy-checar-status e gerenciar-acesso são
# chamadas pelo app com o token da sessão (Supabase Auth); o código confere
# quem é a conta. Deixa o padrão verify_jwt=true.
